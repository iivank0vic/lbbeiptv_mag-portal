<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IPTV LBBE Player</title>
    <link rel="stylesheet" href="css/app.css" />
    <script src="mag/polyfills.js"></script>
</head>
<body>
<div id="video-layer"></div>
<div id="app">
    <div id="splash" class="screen">
        <img class="logo" src="images/logo.png" alt="" />
        <div class="status" id="splash-status">Loading...</div>
        <div class="progress"><div id="splash-bar"></div></div>
    </div>
    <div id="gate" class="screen hidden"></div>
    <div id="shell" class="screen hidden">
        <nav id="rail"></nav>
        <div id="cat-col" class="hidden">
            <div class="cat-head t-overline" id="cat-head"></div>
            <div id="cat-list" class="vlist"></div>
        </div>
        <main id="content">
            <section id="panel-home" class="panel hidden"></section>
            <section id="panel-hint" class="panel hidden"></section>
            <section id="panel-grid" class="panel hidden"></section>
            <section id="panel-settings" class="panel hidden"></section>
            <section id="panel-live" class="panel hidden"></section>
        </main>
    </div>
    <div id="info" class="screen hidden"></div>
    <div id="fs" class="hidden"></div>
    <div id="search-ov" class="hidden"></div>
    <div id="overlays"></div>
    <div id="toast" class="hidden"></div>
</div>

<script src="js/qrcode.js"></script>
<script src="js/platform.js"></script>
<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/library.js"></script>
<script src="js/nav.js"></script>
<script src="js/widgets.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/player.js"></script>
<script src="js/screens/gate.js"></script>
<script src="js/screens/shell.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/grid.js"></script>
<script src="js/screens/live.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/info.js"></script>
<script src="js/screens/fullscreen.js"></script>
<script src="js/screens/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
